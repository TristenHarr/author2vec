[package]
name = "jlens"
version = "0.1.0"
edition.workspace = true

# J-lens (averaged-Jacobian) interpretability harness for the small embedding model.
# Uses candle (autodiff) rather than fastembed/ort (forward-only), so it lives in its
# own crate and never touches the stable corpus embed pipeline.

[dependencies]
shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
candle-transformers = { version = "0.11.0", features = ["metal"] }
tokenizers = "0.23.1"
hf-hub = "0.5.0"
