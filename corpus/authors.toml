# Curated famous, English-original, public-domain authors from Project Gutenberg.
# English-original only, so the embedding signal is the *author's* style rather than
# a translator's. `id` is the Project Gutenberg ebook number. `series` groups books
# that share characters/setting so they can be held out together. `gender` and
# `country` (birth country) are traits we try to recover from writing style alone.

