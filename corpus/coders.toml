# Well-known open-source developers, coder-first. Each dev lists MANY of their repos
# (their marquee projects + their own public repos). Attribution runs
# `git log --author=<them>` per (dev, repo), so we pull EXACTLY that developer's commits
# across full history — old and new — then pool their added lines per file into passages.
# `emails`/`logins`/`name` all become --author patterns (and an identity double-check).
#
# `traits` are recovered from code style alone in the Dimensions view (language, era,
# ecosystem, role). Repos with no `depth` are full-history (needed to reach a founder's
# early work); `depth`/`max_commits` only bound the couple of genuinely huge repos.

languages = ["c", "h", "cpp", "cc", "cxx", "hpp", "py", "js", "mjs", "cjs", "jsx", "ts", "tsx", "go", "rb", "rs", "zig"]

