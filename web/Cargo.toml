[package]
name = "web"
version = "0.1.0"
edition.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
gloo-net = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shared = { path = "../shared" }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "Window", "Document", "Element", "DomRect", "MouseEvent", "HtmlElement", "CssStyleDeclaration"] }
